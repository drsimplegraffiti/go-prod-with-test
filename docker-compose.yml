services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/goapi?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-32-plus-character-secret}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      BCRYPT_COST: 12
      RATE_LIMIT_RPS: 10
    ports:
      - "8080:8080"

volumes:
  pgdata:
